<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Download Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #333533 0%, #242423 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(#F5CB5C);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .ai-avatar {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease-in;
            display: flex;
            width: 100%;
        }

        .message.user-message-container {
            justify-content: flex-end;
        }

        .message.ai-message-container {
            justify-content: flex-start;
        }

        .user-message {
            background: #F5CB5C;
            color: white;
            padding: 12px 16px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            line-height: 1.4;
        }

        .ai-message {
            background: white;
            padding: 12px 16px;
            border-radius: 18px 18px 18px 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 70%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            line-height: 1.4;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #F5CB5C;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: #F5CB5C;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background: #F5CB5C;
            opacity: 0.8;
        }

        .typing {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px 18px 18px 4px;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        .download-btn {
            display: none;
            background: #F5CB5C;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px auto;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 203, 92, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 203, 92, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(245, 203, 92, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 203, 92, 0); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="ai-avatar">🤖</div>
            <h3>Download Assistant AI</h3>
            <small>Your helpful download buddy</small>
        </div>
        
        <div class="chat-messages" id="messages">
            <div class="message ai-message-container">
                <div class="ai-message">
                    Hi! I'm here to help you download that file! Just tell me what you want to download and I'll get it ready for you! 😊
                </div>
            </div>
        </div>

        <div class="typing" id="typing">
            <div class="typing-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" class="input-field" id="userInput" placeholder="Type your message..." maxlength="200">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');

        let messageCount = 0;
        let downloadRequested = false;

        const aiResponses = [
            "Oh interesting! But first, what's your favorite color? This is totally relevant to the download process! 🎨",
            "Great choice! Now, on a scale of 1-10, how much do you like pizza? The download speed depends on this! 🍕",
            "Fascinating! Did you know that cats can't taste sweetness? Anyway, what's your mother's maiden name? For... security purposes! 😸",
            "Perfect! Now I need to verify you're human. Can you solve this: What's 2+2? (Hint: it's not 5) 🤔",
            "Amazing! You're definitely human! Now, what's your biggest fear? The file needs to know if you're scared of downloads! 👻",
            "Interesting fear! Quick question - do you prefer coffee or tea? This affects the file compression algorithm! ☕",
            "Excellent choice! One more thing - can you tell me a joke? The download server loves good humor! 😂",
            "Haha! That was... something! 😅 Now, what's your favorite movie? The bandwidth allocation system is very cinematic! 🎬",
            "Great taste in movies! Just curious - do you believe in aliens? This is for the... cosmic download protocols! 👽",
            "Interesting perspective! Last question, I promise - what's your spirit animal? The file transfer needs to match your energy! 🦄",
            "Perfect! You know what? You've been such a good sport, here's your download button! 🎉"
        ];

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'message user-message-container' : 'message ai-message-container';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = isUser ? 'user-message' : 'ai-message';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-message-container';
            typingDiv.id = 'current-typing';
            
            const typingContent = document.createElement('div');
            typingContent.className = 'typing';
            typingContent.style.display = 'block';
            typingContent.innerHTML = `
                <div class="typing-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            
            typingDiv.appendChild(typingContent);
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const currentTyping = document.getElementById('current-typing');
            if (currentTyping) {
                currentTyping.remove();
            }
        }

        function addDownloadButton() {
            const buttonDiv = document.createElement('div');
            buttonDiv.className = 'message ai-message-container';
            buttonDiv.style.justifyContent = 'center';
            
            const button = document.createElement('button');
            button.className = 'download-btn';
            button.style.display = 'block';
            button.textContent = '⬇️ Download File (totally-not-a-virus.exe)';
            button.onclick = () => {
                button.textContent = '✅ Downloaded! (Just kidding, this is a demo 😄)';
                button.style.background = '#6c757d';
                button.style.cursor = 'default';
                button.style.animation = 'none';
                setTimeout(() => {
                    addMessage("Thanks for playing along! 😄 This was just a fun interactive button demo!", false);
                }, 1000);
            };
            
            buttonDiv.appendChild(button);
            messagesContainer.appendChild(buttonDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleUserMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            showTyping();

            setTimeout(() => {
                hideTyping();
                
                if (messageCount >= aiResponses.length - 1) {
                    addMessage(aiResponses[aiResponses.length - 1], false);
                    setTimeout(() => {
                        addDownloadButton();
                    }, 1000);
                } else {
                    addMessage(aiResponses[messageCount], false);
                    messageCount++;
                }
            }, 1000 + Math.random() * 2000);
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
